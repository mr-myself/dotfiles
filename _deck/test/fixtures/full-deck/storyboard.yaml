    speaker_notes: null
    slots:
      - id: process-art
        brief: "十一月から三月へと移ろう庁舎まわりの景色を水彩で、横長に。文字は一切入れない。"
        width_px: 1562
        height_px: 220
    source_refs: []

  # --- ecosystem, hub form --------------------------------------------------
