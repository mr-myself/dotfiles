# THE FIXTURE DECK - every page type, every slot filled.
#
# WHY THIS FILE EXISTS.
#
# test/fixtures/ was empty. There was no rendered deck anywhere in the repo
# that used the page types the themes declare, which is how `standard-3col`
# came to ship slot coordinates - col-N-art at top: 277 - that were inside the
# card body box and could not be used. Nothing rendered them, so nothing
# caught them. The PO found out by building a real deck and measuring 38
# collisions.
#
# It earns its keep twice, and both are load-bearing:
#
#   AS DOCUMENTATION   someone about to write a storyboard can render this and
#                      see what each page type actually looks like. Not having
#                      that was the direct cause of the first real deck being
#                      unreadable.
#   AS A TEST          rendered and linted in test/geometry/fixture-deck.test.js,
#                      and measured in test/geometry/occupancy-baseline.test.js,
#                      which is where the occupancy rule's thresholds come
#                      from. They are measured off this deck rather than
#                      chosen by feel.
#
# THE CONTENT IS INVENTED. A fictional municipality choosing a payroll system.
# Nothing is confidential, nothing is quoted from anywhere, and no number in
# it is real - which is also why this deck carries no sources/ directory: the
# intake gates check a deck built from imported material, and this one was
# not.
#
# WHEN YOU ADD A PAGE TYPE, add a slide here. The cross-check in
# test/unit/content.test.js fails if an implemented page type has no fixture
# slide, so this cannot quietly fall behind again.
schema: deck.storyboard/1
title: "架空市 給与システム更新のご提案"

slides:
  # --- cover ----------------------------------------------------------------
  - id: cover
    page_type: cover
    purpose: "資料の主題と対象を一目で伝える"
    section_label: "ご提案"
    title: "給与システム更新のご提案"
    subtitle: "架空市 総務課 向け"
    speaker_notes: null
    slots:
      - id: cover-art
        brief: "朝の市庁舎と周囲の山並みを水彩で。人物は描かず、文字は一切入れない。"
        width_px: 760
        height_px: 941
    source_refs: []

  # --- agenda ---------------------------------------------------------------
