    footer:
      label: "ご確認"
      text: "本日は比較と進めかたまでをご確認いただきます。"
    speaker_notes: null
    slots:
      - id: agenda-art
        brief: "机の上の書類と窓辺の植物を水彩で、淡く。文字は一切入れない。"
        width_px: 620
        height_px: 871
    source_refs: []

  # --- section-divider ------------------------------------------------------
  - id: ch-01
    page_type: section-divider
    purpose: "第1章の始まりを示す"
    section_label: "第01章"
    title: "いまの給与事務"
    subtitle: "どこに時間がかかっているか"
    speaker_notes: null
    slots:
      - id: divider-art
        brief: "静かな川面と対岸の木立を水彩で。文字は一切入れない。"
        width_px: 700
        height_px: 941
    source_refs: []

  # --- standard-3col --------------------------------------------------------
  #
  # THE THEME'S FLAGSHIP LAYOUT: a picture above each column. All three column
  # slots are declared and filled here, which is exactly what no fixture did
  # before and exactly why the collision shipped.
  - id: three-points
    page_type: standard-3col
    purpose: "いまの事務で時間がかかっている三か所を並べて示す"
    section_label: "いまの給与事務"
    title: "時間がかかっている三か所"
    subtitle: "いずれも月末の同じ週に重なっている"
    body:
      - kind: cards
        cards:
          - heading: "勤怠の集計"
            body: "各課から届く様式がそろっておらず、突き合わせに二日かかっている。"
            icon: teal
          - heading: "手当の確認"
            body: "住居手当と通勤手当の変更届を、紙の台帳と照らして確認している。"
            icon: orange
          - heading: "年末調整"
            body: "十一月から十二月にかけて、他の二つと同じ担当者に集中している。"
            icon: teal
    footer:
      label: "要点"
      text: "三つとも、同じ二名の担当者に同じ週に集中している。"
    speaker_notes: null
    slots:
      - id: col-1-art
        brief: "書類の束とタイムカードを水彩で。文字は一切入れない。"
        width_px: 474
        height_px: 210
      - id: col-2-art
        brief: "台帳と封筒を水彩で。文字は一切入れない。"
        width_px: 474
        height_px: 210
      - id: col-3-art
        brief: "冬の窓辺と暦を水彩で。文字は一切入れない。"
        width_px: 474
        height_px: 210
    source_refs: []

  # --- standard-3col, THE SECOND ONE ----------------------------------------
  #
  # A SECOND SLIDE OF A PAGE TYPE THAT HAS SLOTS, declaring the same slot ids
  # as the first. This shape existed nowhere - the fixture had one slide per
  # page type and the stress harness did too - and that is exactly why a deck
  # could carry column art on only ONE three-column slide and neither of us
  # saw it. The PO's real deck has four, so twelve illustrations could not be
  # imported and four pages shipped as empty frames.
  #
  # `col-1-art` names the first column's picture, which every three-column
  # slide has. Slot ids are unique within a slide and repeat across slides;
  # the pair (slide, slot) is the identity, and it is what `prompts` puts in
  # the filename and what `assets import` addresses.
  - id: who-does-it
    page_type: standard-3col
    purpose: "移行を誰がやるのかを三つに分けて示す"
    section_label: "導入の進めかた"
    title: "誰が手を動かすか"
    subtitle: "三者の分担をはっきりさせておきます"
    body:
      - kind: cards
        cards:
          - heading: "総務課"
            body: "要件の確認と、庁内への周知を担当する。"
            icon: teal
          - heading: "情報システム担当"
            body: "データ移行の段取りと、既存システムとの接続を見る。"
            icon: orange
          - heading: "導入業者"
            body: "設定と研修を行い、最初の一か月は常駐で支援する。"
            icon: teal
    footer:
      label: "要点"
      text: "三者とも十一月から動ける体制にしておきます。"
    speaker_notes: null
    slots:
      - id: col-1-art
        brief: "書類を囲んで打ち合わせる庁舎の一室を水彩で。文字は一切入れない。"
        width_px: 474
        height_px: 210
      - id: col-2-art
        brief: "サーバー室の機器と配線を水彩で、淡く。文字は一切入れない。"
        width_px: 474
        height_px: 210
      - id: col-3-art
        brief: "研修を受ける職員の手元と資料を水彩で。文字は一切入れない。"
        width_px: 474
        height_px: 210
    source_refs: []

  # --- statement ------------------------------------------------------------
  #
  # The page type the theme exempts from the occupancy rule by name. Its
  # whitespace is the design, and the fixture is where that claim is checked:
  # occupancy-baseline.test.js measures this page and asserts it falls UNDER
  # the threshold the other page types are held to.
  - id: the-point
    page_type: statement
    purpose: "この資料でいちばん伝えたい一行を、他に何も置かずに示す"
    section_label: "いちばん伝えたいこと"
    title: "いま決めるのは、どの製品かではありません。"
    subtitle: null
    body:
      - kind: statement
        text: "来年四月に間に合わせるために、十一月までに何を決め終えるかです。"
    footer:
      label: "ご判断"
      text: "この一点だけ、本日のうちに向きをそろえさせてください。"
    speaker_notes: null
    slots: []
    source_refs: []

  # --- comparison -----------------------------------------------------------
  - id: options
    page_type: comparison
    purpose: "三つの候補を同じ軸で比べ、どこが違うのかを示す"
    section_label: "候補システムの比較"
    title: "三つの候補と、その違い"
    subtitle: "同じ三つの軸で見ています"
    comparison:
      axes:
        - "初期費用"
        - "庁内で運用できるか"
        - "既存システムとの連携"
      columns:
        - label: "A社"
          caption: "県内の自治体での導入が多い"
          cells:
            - "高い"
            - "研修なしで引き継げる"
            - "財務会計のみ"
        - label: "B社"
          caption: "全国向けのパッケージ"
          cells:
            - "中ほど"
            - "年に一度の研修が要る"
            - "財務会計と人事給与"
        - label: "C社"
          caption: "現行システムの後継"
          cells:
            - "安い"
            - "いまの手順をそのまま使える"
            - "財務会計のみ"
      note: "連携の範囲を優先するか、庁内での運用しやすさを優先するかで分かれます。"
    speaker_notes: null
    slots:
      - id: comparison-art
        brief: "三社の担当者が同じ資料を囲んで話している場面を水彩で、淡く。文字は一切入れない。"
        width_px: 1562
        height_px: 220
    source_refs: []

  # --- process --------------------------------------------------------------
