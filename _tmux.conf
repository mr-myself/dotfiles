set -g terminal-overrides 'xterm*:smcup@:rmcup@'
set-option -g mouse off
set -s escape-time 0

set-option -g default-command "reattach-to-user-namespace -l zsh"

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c '#{pane_current_path}'
bind %   split-window -h -c '#{pane_current_path}'

# ==============================================================================
# Navigation: fuzzy pickers instead of `tmux ls` and guessing index numbers
# ==============================================================================
# squad and deck each take their own window and rename it to the run title, so a
# fuzzy list of WINDOWS across every session is the real index of work in
# flight. `prefix w` shadows choose-window deliberately - same operation, but
# not limited to the current session.
bind w display-popup -E -w 80% -h 70% "~/.local/bin/tmux-pick-window"

# Sessions, sesh projects and zoxide history in one list; picking a directory
# with no session yet creates and names it.
bind f display-popup -E -w 80% -h 70% "~/.local/bin/tmux-pick-session"

# Back to the previous session, for the two-task ping-pong that waiting on an
# agent turns into.
bind Space run-shell "sesh last || true"

# A new window in the MAIN repository rather than the worktree the pane is in.
# `prefix c` inherits pane_current_path, which is right inside a squad run and
# wrong the moment you want master, a pull, or the app as it actually ships.
bind C run-shell "~/.local/bin/tmux-main-window '#{pane_current_path}'"
