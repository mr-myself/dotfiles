name: harness

# The four wiring harnesses in this repo assert the surface that squad, vet and
# deck GENERATE - prompts, checklists, gates, helper scripts. They are the only
# thing standing between a one-character edit to a 4,800-line generator and a
# squad that silently reviews the wrong diff, so they must not depend on anyone
# remembering to run them.
#
# macOS, not ubuntu, on purpose: these are macOS tools. They shell out to
# osascript, reattach-to-user-namespace and BSD date, and `deck` renders through
# the installed Google Chrome. A green ubuntu run would not mean anything about
# the machine the PO actually works on.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The hermetic suites: `gen-helpers` writes the whole generated surface
  # without a tmux server, a worktree or an agent, so these need nothing but
  # jq, shellcheck and a git identity.
  squad-and-vet:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: brew install jq shellcheck

      # The harnesses create throwaway git repos and commit in them.
      - name: Configure a git identity
        run: |
          git config --global user.name 'harness'
          git config --global user.email 'harness@example.invalid'

      # The install step README documents, and the one the vet harness depends
      # on: it copies vet to a path containing a space, where the bundled
      # _vet/checklist.md is no longer beside the script, so the resolution
      # falls through to ~/.vet/checklist.md. Without it vet correctly refuses
      # to review against an empty checklist and the spaced-path assertions
      # fail - which is CI exercising the documented installation, not a bug.
      - name: Install the review checklist (~/.vet)
        run: ln -s "$PWD/_vet" "$HOME/.vet"

      - name: shellcheck the launchers
        run: shellcheck -S error squad squad-herdr vet deck whatdid tmux-pick-window tmux-pick-session tmux-main-window install.sh

      # install.sh is what a new machine runs first, so the thing worth proving
      # is that it is safe: HOME is pointed at a throwaway directory holding a
      # hand-written .zshrc, and that file has to survive.
      - name: install.sh links a fresh HOME without clobbering a real file
        run: |
          fresh="$(mktemp -d)"
          printf '# hand written\nexport MINE=1\n' > "$fresh/.zshrc"
          HOME="$fresh" ./install.sh
          test -f "$fresh/.zshrc" && ! test -L "$fresh/.zshrc" \
            || { echo "install.sh replaced a real ~/.zshrc"; exit 1; }
          grep -q 'export MINE=1' "$fresh/.zshrc" \
            || { echo "install.sh altered a real ~/.zshrc"; exit 1; }
          for l in .tmux.conf .vimrc .vet .takt .local/bin/squad .local/bin/tmux-pick-window; do
            test -L "$fresh/$l" || { echo "install.sh did not link $l"; exit 1; }
          done
          # Idempotent: a second run must change nothing.
          HOME="$fresh" ./install.sh | grep -q 'linked/repointed: 0' \
            || { echo "install.sh is not idempotent"; exit 1; }

      - name: squad wiring
        run: ./test-squad-wiring.sh

      - name: vet wiring
        run: ./test-vet-wiring.sh

      - name: vet autoclose
        run: ./test-vet-autoclose.sh

  # deck's harness runs `deck gate doctor`, which REPORTS on the real
  # environment rather than stubbing it, so this job has to supply the
  # environment: Chrome to render, poppler to rasterize, node to run the
  # renderer. The pinned font is vendored in _deck/themes, so nothing is
  # downloaded for it.
  deck:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: brew install jq shellcheck poppler

      - name: Install Google Chrome
        run: brew install --cask google-chrome

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure a git identity
        run: |
          git config --global user.name 'harness'
          git config --global user.email 'harness@example.invalid'

      # Before the harness, not after it: `deck gate --help` refuses to say
      # anything while _deck/node_modules is missing ("deck's dependencies are
      # not installed"), and the wiring assertions read that help text.
      - name: Install the renderer's dependencies
        run: npm ci --prefix _deck

      - name: deck wiring
        run: ./test-deck-wiring.sh

      # The measurements themselves, against real Chrome. Split by suite rather
      # than run through `npm test`, because only one of them needs a different
      # deadline and the repo's own test script should not be bent to CI.
      - name: deck renderer tests (unit)
        run: npm run test:unit --prefix _deck

      - name: deck renderer tests (geometry)
        run: npm run test:geometry --prefix _deck

      # The full pipeline - render, rasterize, lint - clears package.json's five
      # minutes locally and does not on a cold runner that has just installed
      # Chrome. 576 of the 577 tests passed there; this one timed out. The
      # deadline is raised HERE, so the PO's own `npm test` keeps the shorter
      # one that is right for a warm machine.
      - name: deck renderer tests (end-to-end pipeline)
        run: node --test --test-timeout=1200000 "test/e2e/*.test.js"
        working-directory: _deck
